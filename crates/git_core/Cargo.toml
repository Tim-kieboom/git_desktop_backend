[package]
name = "git_core"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
directories = "6.0.0"
git2 = "0.21.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
vecmap = { git = "https://github.com/Tim-kieboom/vecmap.git", version = "0.1.3" }

[dev-dependencies]
tempfile = "3.27.0"
